version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: postgres_patrimonio
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: patrimonio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./api-patrimonio
    container_name: api_patrimonio
    restart: always
    env_file:
      - ./api-patrimonio/.env
    ports:
      - "3000:3000"
      - "5555:5555"
    depends_on:
      - postgres
    volumes:
      - ./api-patrimonio:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: frontend_patrimonio
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
