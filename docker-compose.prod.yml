services:
  postgres:
    image: postgres:15
    container_name: postgres_patrimonio
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api-patrimonio
      target: production
    container_name: api_patrimonio
    restart: always
    # ports:
    #   - "3210:3000"
    env_file:
      - ./api-patrimonio/.env
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode !== 200 ? 1 : 0))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: frontend_patrimonio
    restart: always
    ports:
      - "1010:80"
    depends_on:
      api:
        condition: service_started

  backup:
    image: postgres:15-alpine
    container_name: backup_patrimonio
    restart: unless-stopped
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGHOST: postgres
    depends_on:
      - postgres
    command: >
      sh -c "
        echo '0 3 * * * /backup.sh' > /etc/crontabs/root &&
        crond -f -l 2
      "

  prisma-studio:
    build:
      context: ./api-patrimonio
      target: production
    container_name: prisma-studio
    profiles:
      - studio
    ports:
      - "127.0.0.1:5555:5555"
    env_file:
      - ./api-patrimonio/.env
    command: >
      sh -c "
        apk add --no-cache socat > /dev/null 2>&1;
        npx prisma studio --port 5556 --browser none > /dev/null 2>&1 &
        until nc -z 127.0.0.1 5556; do sleep 1; done;
        socat TCP-LISTEN:5555,fork TCP:127.0.0.1:5556
      "
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
